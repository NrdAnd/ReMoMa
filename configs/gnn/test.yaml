# Complete experiment configuration. Paths are relative to the repository root.
data:
  raw_dir: data/raw
  adj_matrix_path: data/graphs/tmfg_lag150_bins2000.csv
  processed_dir: data/processed/test
  use_precomputed: true
  force_preprocess: false
  preprocess_chunk_size: 1024
  feature_dtype: float16
  n_lags: 150
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid
  threshold: 0.0001
  prediction_horizon: 10
  split_strategy: by_lag
  train_files:
  - 0
  val_files:
  - 0
  test_files:
  - 0
  train_ratio: 0.7
  val_ratio: 0.15
  normalize_prices: true
  subsample_seed: 42
model:
  type: gcn
  hidden_channels: 225
  num_layers: 3
  dropout: 0.3
  num_heads: 2
  family: gnn
training:
  epochs: 3
  batch_size: 256
  static_graph_batching: false
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3
  grad_clip: 1.0
  use_class_weights: true
  num_workers: 0
  seed: 42
paths:
  checkpoints: runs/gnn
