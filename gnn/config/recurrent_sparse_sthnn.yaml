data:
  raw_dir: ../lobster_cisco
  adj_matrix_path: data/adjacency/recurrent_sparse_tmfg_lag100_bins2000_from_nmi_mean.tsv
  processed_dir: data/processed_recurrent_lag100_nmi_mean
  use_precomputed: true
  force_preprocess: false
  preprocess_chunk_size: 2048
  feature_dtype: float16
  n_lags: 100
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid
  label_mode: abs
  threshold: 100
  prediction_horizon: 50

  split_strategy: by_lag
  train_files: [0, 1, 2]
  val_files: [3]
  test_files: [4]
  train_ratio: 0.70
  val_ratio: 0.15

  normalize_prices: true
  max_samples_per_class: 50000
  max_val_samples: 25000
  max_test_samples: 50000

model:
  type: recurrent_sparse_sthnn
  hidden_dim: 5
  message_iterations: 1
  readout_mode: all_lags
  readout_dropout: 0.15
  add_self_lag_edges: false
  self_lag_edge_dropout: 0.15

training:
  epochs: 50
  batch_size: 32
  static_graph_batching: true
  lr: 3.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 8
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  grad_clip: 1.0
  use_class_weights: false
  tune_threshold: true
  num_workers: 4
  seed: 42

paths:
  checkpoints: checkpoints/recurrent_sparse_sthnn_nmi_mean/
