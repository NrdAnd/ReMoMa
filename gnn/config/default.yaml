data:
  raw_dir: ../lobster_cisco
  adj_matrix_path: ../tmfg/tmfg_adj_matrix_250_bins.csv
  processed_dir: data/processed
  n_lags: 150          # lags from 0 to 150 → 151 time steps per node
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid           # 'mid' (mid-price) or 'micro' (microprice)
  threshold: 1.0e-4         # pct change threshold for flat/up/down
  prediction_horizon: 50    # k: label = direction of price[t+k] vs price[t]

  split_strategy: by_lag    # 'by_file' or 'by_lag'
  # used by by_file:
  train_files: [0, 1, 2]
  val_files: [3]
  test_files: [4]
  # used by by_lag:
  train_ratio: 0.05
  val_ratio: 0.02

  normalize_prices: true

model:
  type: gcn             # 'gcn', 'gat', 'sage'  ← gcn è 3-5x più veloce di gat
  hidden_channels: 225
  num_layers: 3
  dropout: 0.3
  num_heads: 2          # GAT only

training:
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  grad_clip: 1.0
  use_class_weights: false  # micro + threshold=0 → classi bilanciate, non serve
  num_workers: 8        # parallelizza il data loading su CPU
  seed: 42

paths:
  checkpoints: checkpoints/
