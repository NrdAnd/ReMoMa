data:
  raw_dir: ../lobster_cisco
  adj_matrix_path: ../tmfg/cisco_tmfg_adj_matrix_2000_bins.csv
  processed_dir: data/processed
  use_precomputed: true      # train/eval read mmap tensors from processed_dir
  force_preprocess: true     # RIMETTI false dopo il primo rebuild (fix binner NaN)
  preprocess_chunk_size: 2048
  feature_dtype: float16     # disk dtype for X_*.npy (runtime cast to float32)
  n_lags: 150          # lags from 0 to 150 → 151 time steps per node
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid           # 'mid' (mid-price) or 'micro' (microprice)
  threshold: 1.0e-4         # pct change threshold for flat/up/down
  prediction_horizon: 50    # k: label = direction of price[t+k] vs price[t]

  split_strategy: by_lag    # 'by_file' or 'by_lag'
  # used by by_file:
  train_files: [0, 1, 2]
  val_files: [3]
  test_files: [4]
  # used by by_lag:
  train_ratio: 0.70
  val_ratio: 0.15

  normalize_prices: true
  max_samples_per_class: 70000   # null → nessun cap; numero → bilancia train a N sample/classe
  max_val_samples: 30000         # null → usa tutto; subsample casuale per val veloce
  max_test_samples: null         # null → usa tutto per la valutazione finale

model:
  type: gcn             # 'gcn', 'gat', 'sage'  ← gcn è 3-5x più veloce di gat
  hidden_channels: 225
  num_layers: 3
  dropout: 0.3
  num_heads: 2          # GAT only

training:
  epochs: 3
  batch_size: 256
  static_graph_batching: true  # true: GCN-only static tensor path
  lr: 6.0e-5
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  grad_clip: 1.0
  use_class_weights: false  # sostituito da balanced sampling in preprocessing
  num_workers: 8        # parallelizza il data loading su CPU
  seed: 42

paths:
  checkpoints: checkpoints/
