data:
  raw_dir: ../../lobster_cisco
  adj_matrix_path: ../tmfg/tmfg_adj_matrix_250_bins.csv
  processed_dir: data/processed
  n_lags: 150          # lags from 0 to 150 → 151 time steps per node
  n_levels: 10
  n_volume_bins: 2000
  threshold: 1.0e-4         # mid-price pct change threshold for flat/up/down
  prediction_horizon: 10    # k: label = direction of mid[t+k] vs mid[t]

  split_strategy: by_file   # 'by_file' or 'by_lag'
  # used by by_file:
  train_files: [0, 1, 2]
  val_files: [3]
  test_files: [4]
  # used by by_lag:
  train_ratio: 0.70
  val_ratio: 0.15

  normalize_prices: true

model:
  type: gat             # 'gcn', 'gat', 'sage'
  hidden_channels: 64
  num_layers: 3
  dropout: 0.3
  num_heads: 4          # GAT only

training:
  epochs: 100
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  grad_clip: 1.0
  use_class_weights: true
  num_workers: 0
  seed: 42

paths:
  checkpoints: checkpoints/
