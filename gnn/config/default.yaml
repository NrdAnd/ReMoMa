data:
  raw_dir: ../lobster_cisco
  adj_matrix_path: ../tmfg/cisco_tmfg_adj_matrix_2000_bins.csv
  processed_dir: data/processed
  use_precomputed: true      # train/eval read mmap tensors from processed_dir
  force_preprocess: false   # true -> rigenera i tensori anche se la cache combacia
  preprocess_chunk_size: 2048
  feature_dtype: float16     # disk dtype for X_*.npy (runtime cast to float32)
  n_lags: 150          # lags from 0 to 150 → 151 time steps per node
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid           # 'mid' (mid-price) or 'micro' (microprice)
  label_mode: abs           # 'pct' (soglia relativa) o 'abs' (soglia in unità di prezzo / tick)
  threshold: 100            # LOBSTER prices sono in $×10000 → un tick ($0.01) = 100 unità
                            # (pct userebbe es. 1.0e-4)
  prediction_horizon: 50    # k: label = direction of price[t+k] vs price[t]

  split_strategy: by_lag    # 'by_file' or 'by_lag'
  # used by by_file:
  train_files: [0, 1, 2]
  val_files: [3]
  test_files: [4]
  # used by by_lag:
  train_ratio: 0.70
  val_ratio: 0.15

  normalize_prices: true
  max_samples_per_class: 50000   # null → nessun cap; numero → bilancia train a N sample/classe
  max_val_samples: 25000         # null → usa tutto; subsample casuale per val veloce
  max_test_samples: 50000         # null → usa tutto per la valutazione finale

model:
  type: gcn             # 'gcn', 'gat', 'sage' — scegli con --model, i parametri sotto si autoadattano
  hidden_channels: 225  # default (gcn)
  num_layers: 3
  dropout: 0.3
  num_heads: 2          # GAT only
  add_lag_feature: true # aggiunge una 3ª feature per nodo = lag normalizzato [0,1]
  # preset per architettura: sovrascrivono i valori sopra in base al tipo scelto
  # (es. SAGE ha ~2x parametri/layer → hidden più basso per restare a ~180-200k)
  overrides:
    sage:
      hidden_channels: 160
    gat:
      hidden_channels: 160
      num_heads: 2
    cgnn:                   # CNN temporale (sui lag) + GNN spaziale (sul grafo)
      hidden_channels: 175  # ~181k parametri (confrontabile con gli altri modelli)
      cnn_channels: 64
      cnn_kernel: 5
      use_bin: false        # Bilinear Normalization: provata, peggiora (0.628→0.569) — disattivata
    stgcn:                  # blocchi [temporale → grafo → temporale] alternati
      hidden_channels: 110  # ~183k parametri
      num_layers: 2         # numero di ST-blocchi
      cnn_kernel: 3

training:
  epochs: 50
  batch_size: 128
  static_graph_batching: true  # true: GCN-only static tensor path
  lr: 3.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 8
  lr_scheduler_patience: 3   # epoch di val-loss non in calo prima di tagliare il LR
  lr_scheduler_factor: 0.5   # fattore di riduzione del LR (0.5 = dimezza)
  grad_clip: 1.0
  use_class_weights: false  # sostituito da balanced sampling in preprocessing
  tune_threshold: true      # valutazione finale: riporta F1 argmax E con soglie tarate su val
  num_workers: 8        # parallelizza il data loading su CPU
  seed: 42

paths:
  checkpoints: checkpoints/
