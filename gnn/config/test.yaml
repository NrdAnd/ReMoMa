data:
  raw_dir: ../lobster_cisco
  adj_matrix_path: ../tmfg/tmfg_adj_matrix_250_bins.csv
  processed_dir: data/processed
  use_precomputed: true
  force_preprocess: false
  preprocess_chunk_size: 1024
  feature_dtype: float16
  n_lags: 150
  n_levels: 10
  n_volume_bins: 2000
  price_type: mid
  threshold: 1.0e-4
  prediction_horizon: 10

  split_strategy: by_lag    # usa un solo file, tagliato in train/val/test
  train_files: [0]          # ignorato da by_lag, ma richiesto da evaluate.py
  val_files: [0]
  test_files: [0]
  train_ratio: 0.70       
  val_ratio: 0.15

  normalize_prices: true

model:
  type: gcn
  hidden_channels: 225
  num_layers: 3
  dropout: 0.3
  num_heads: 2

training:
  epochs: 3
  batch_size: 256
  static_graph_batching: false
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  grad_clip: 1.0
  use_class_weights: true
  num_workers: 8
  seed: 42

paths:
  checkpoints: checkpoints/test/
